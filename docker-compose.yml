services:
  cex_tbot_rest:
    image: python:3.12-slim
    working_dir: /app
    environment:
      CEX_TBOT_REPO_ARCHIVE_URL: ${CEX_TBOT_REPO_ARCHIVE_URL:-https://github.com/seleznevm/cex_tbot/archive/refs/heads/main.zip}
      CEX_TBOT_EXECUTION_MODE: ${CEX_TBOT_EXECUTION_MODE:-paper_sim}
      CEX_TBOT_API_TOKEN: ${CEX_TBOT_API_TOKEN:-}
      CEX_TBOT_TELEGRAM_BOT_TOKEN: ${CEX_TBOT_TELEGRAM_BOT_TOKEN:-}
      CEX_TBOT_ALLOWED_SENDER_IDS: ${CEX_TBOT_ALLOWED_SENDER_IDS:-125619710}
      CEX_TBOT_JSON_SUBMITTER_IDS: ${CEX_TBOT_JSON_SUBMITTER_IDS:-125619710}
      CEX_TBOT_TELEGRAM_ALLOWED_CHAT_IDS: ${CEX_TBOT_TELEGRAM_ALLOWED_CHAT_IDS:-}
      CEX_TBOT_TELEGRAM_ALLOWED_THREAD_IDS: ${CEX_TBOT_TELEGRAM_ALLOWED_THREAD_IDS:-}
      GATE_DEMO_API: ${GATE_DEMO_API:-https://fx-api-testnet.gateio.ws/api/v4}
      GATE_DEMO_KEY: ${GATE_DEMO_KEY:-}
      GATE_DEMO_SECRET: ${GATE_DEMO_SECRET:-}
      GATE_DEMO_TEST_ORDER_SIZE: ${GATE_DEMO_TEST_ORDER_SIZE:-1.0}
      GATE_DEMO_LEVERAGE: ${GATE_DEMO_LEVERAGE:-10}
      CEX_TBOT_MIN_CONFIDENCE_SCORE: ${CEX_TBOT_MIN_CONFIDENCE_SCORE:-0.70}
      CEX_TBOT_MAX_AGGREGATE_OPEN_RISK_PERCENT: ${CEX_TBOT_MAX_AGGREGATE_OPEN_RISK_PERCENT:-1.0}
      CEX_TBOT_MAX_DAILY_DRAWDOWN_PERCENT: ${CEX_TBOT_MAX_DAILY_DRAWDOWN_PERCENT:-2.0}
      CEX_TBOT_MAX_OPEN_POSITIONS: ${CEX_TBOT_MAX_OPEN_POSITIONS:-2}
    volumes:
      - ./:/app
      - ./.runtime:/app/.runtime
    command:
      - sh
      - -lc
      - |
        set -eu
        python - <<'PY'
        import os
        import shutil
        import tempfile
        import urllib.request
        import zipfile
        from pathlib import Path

        app_dir = Path("/app")
        archive_url = os.environ.get("CEX_TBOT_REPO_ARCHIVE_URL", "https://github.com/seleznevm/cex_tbot/archive/refs/heads/main.zip")
        if not (app_dir / "pyproject.toml").exists():
            tmpdir = Path(tempfile.mkdtemp(prefix="cex_tbot_bootstrap_"))
            archive_path = tmpdir / "repo.zip"
            urllib.request.urlretrieve(archive_url, archive_path)
            with zipfile.ZipFile(archive_path) as zf:
                zf.extractall(tmpdir)
            extracted = next(path for path in tmpdir.iterdir() if path.is_dir())
            app_dir.mkdir(parents=True, exist_ok=True)
            for child in extracted.iterdir():
                target = app_dir / child.name
                if target.exists():
                    if target.is_dir():
                        shutil.rmtree(target)
                    else:
                        target.unlink()
                shutil.move(str(child), str(target))
            shutil.rmtree(tmpdir, ignore_errors=True)
        PY
        pip install --no-cache-dir -e /app/[dev]
        PYTHONPATH=/app/src python -m cex_tbot serve-rest --storage-dir /app/.runtime/session --host 0.0.0.0 --port 8000
    ports:
      - "${CEX_TBOT_PUBLIC_PORT:-8000}:8000"
    restart: unless-stopped

  cex_tbot_telegram:
    image: python:3.12-slim
    working_dir: /app
    environment:
      CEX_TBOT_REPO_ARCHIVE_URL: ${CEX_TBOT_REPO_ARCHIVE_URL:-https://github.com/seleznevm/cex_tbot/archive/refs/heads/main.zip}
      CEX_TBOT_EXECUTION_MODE: ${CEX_TBOT_EXECUTION_MODE:-paper_sim}
      CEX_TBOT_API_TOKEN: ${CEX_TBOT_API_TOKEN:-}
      CEX_TBOT_TELEGRAM_BOT_TOKEN: ${CEX_TBOT_TELEGRAM_BOT_TOKEN:-}
      CEX_TBOT_ALLOWED_SENDER_IDS: ${CEX_TBOT_ALLOWED_SENDER_IDS:-125619710}
      CEX_TBOT_JSON_SUBMITTER_IDS: ${CEX_TBOT_JSON_SUBMITTER_IDS:-125619710}
      CEX_TBOT_TELEGRAM_ALLOWED_CHAT_IDS: ${CEX_TBOT_TELEGRAM_ALLOWED_CHAT_IDS:-}
      CEX_TBOT_TELEGRAM_ALLOWED_THREAD_IDS: ${CEX_TBOT_TELEGRAM_ALLOWED_THREAD_IDS:-}
      GATE_DEMO_API: ${GATE_DEMO_API:-https://fx-api-testnet.gateio.ws/api/v4}
      GATE_DEMO_KEY: ${GATE_DEMO_KEY:-}
      GATE_DEMO_SECRET: ${GATE_DEMO_SECRET:-}
      GATE_DEMO_TEST_ORDER_SIZE: ${GATE_DEMO_TEST_ORDER_SIZE:-1.0}
      GATE_DEMO_LEVERAGE: ${GATE_DEMO_LEVERAGE:-10}
      CEX_TBOT_MIN_CONFIDENCE_SCORE: ${CEX_TBOT_MIN_CONFIDENCE_SCORE:-0.70}
      CEX_TBOT_MAX_AGGREGATE_OPEN_RISK_PERCENT: ${CEX_TBOT_MAX_AGGREGATE_OPEN_RISK_PERCENT:-1.0}
      CEX_TBOT_MAX_DAILY_DRAWDOWN_PERCENT: ${CEX_TBOT_MAX_DAILY_DRAWDOWN_PERCENT:-2.0}
      CEX_TBOT_MAX_OPEN_POSITIONS: ${CEX_TBOT_MAX_OPEN_POSITIONS:-2}
    volumes:
      - ./:/app
      - ./.runtime:/app/.runtime
    command:
      - sh
      - -lc
      - |
        set -eu
        python - <<'PY'
        import os
        import shutil
        import tempfile
        import urllib.request
        import zipfile
        from pathlib import Path

        app_dir = Path("/app")
        archive_url = os.environ.get("CEX_TBOT_REPO_ARCHIVE_URL", "https://github.com/seleznevm/cex_tbot/archive/refs/heads/main.zip")
        if not (app_dir / "pyproject.toml").exists():
            tmpdir = Path(tempfile.mkdtemp(prefix="cex_tbot_bootstrap_"))
            archive_path = tmpdir / "repo.zip"
            urllib.request.urlretrieve(archive_url, archive_path)
            with zipfile.ZipFile(archive_path) as zf:
                zf.extractall(tmpdir)
            extracted = next(path for path in tmpdir.iterdir() if path.is_dir())
            app_dir.mkdir(parents=True, exist_ok=True)
            for child in extracted.iterdir():
                target = app_dir / child.name
                if target.exists():
                    if target.is_dir():
                        shutil.rmtree(target)
                    else:
                        target.unlink()
                shutil.move(str(child), str(target))
            shutil.rmtree(tmpdir, ignore_errors=True)
        PY
        pip install --no-cache-dir -e /app/[dev,telegram]
        PYTHONPATH=/app/src python -m cex_tbot tg-runner --storage-dir /app/.runtime/session --allowed-sender-ids "${CEX_TBOT_ALLOWED_SENDER_IDS:-125619710}" --allowed-json-sender-ids "${CEX_TBOT_JSON_SUBMITTER_IDS:-${CEX_TBOT_ALLOWED_SENDER_IDS:-125619710}}" --allowed-chat-ids "${CEX_TBOT_TELEGRAM_ALLOWED_CHAT_IDS:-}" --allowed-thread-ids "${CEX_TBOT_TELEGRAM_ALLOWED_THREAD_IDS:-}"
    restart: unless-stopped
