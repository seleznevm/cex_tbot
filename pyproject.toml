[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cex-tbot"
version = "0.1.0"
description = "Semi-auto CEX trading bot scaffold"
requires-python = ">=3.11"
authors = [
  { name = "Michael" }
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
